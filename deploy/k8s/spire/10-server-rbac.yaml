apiVersion: v1
kind: ServiceAccount
metadata:
  name: n4dtls-spire-server
  namespace: n4dtls-spire
---
# The server validates the projected service-account tokens its agents present
# (k8s_psat node attestation), which is a TokenReview.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: n4dtls-spire-server
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n4dtls-spire-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: n4dtls-spire-server
subjects:
  - kind: ServiceAccount
    name: n4dtls-spire-server
    namespace: n4dtls-spire
