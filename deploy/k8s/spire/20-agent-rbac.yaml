apiVersion: v1
kind: ServiceAccount
metadata:
  name: n4dtls-spire-agent
  namespace: n4dtls-spire
---
# The k8s workload attestor asks the kubelet which pod owns a PID. That is nodes/proxy, and
# it is NOT granted to a node's default identity -- without this the attestor gets 403.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: n4dtls-spire-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n4dtls-spire-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: n4dtls-spire-agent
subjects:
  - kind: ServiceAccount
    name: n4dtls-spire-agent
    namespace: n4dtls-spire
